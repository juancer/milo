# Runs on every pull request. Merging to main requires this check to pass.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The admin UI is embedded in the binary, so it must be built before vet and test can compile.
      - run: make web-build test build-arm64 build-armv7
