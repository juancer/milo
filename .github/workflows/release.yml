# Every push to main builds Milo for the Pi and republishes the rolling "latest" release.
# Devices poll that release (deploy/pi/milo-update.sh); nothing connects to them.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The admin UI is embedded in the binary, so it must be built before vet and test can compile.
      - run: make web-build test build-arm64 build-armv7
      - name: Checksums and commit marker
        run: |
          cd dist
          echo "$GITHUB_SHA" > commit.txt
          sha256sum milo-linux-arm64 milo-linux-armv7 > SHA256SUMS
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest --prerelease --target "$GITHUB_SHA" \
            --title "Latest main ($(git rev-parse --short HEAD))" \
            --notes "Rolling build of main, used by device auto-update." \
            dist/milo-linux-arm64 dist/milo-linux-armv7 dist/SHA256SUMS dist/commit.txt
