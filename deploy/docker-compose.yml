name: milo

x-user: &user "${MILO_UID:-1000}:${MILO_GID:-1000}"

x-go: &go
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: milo-dev-go
  user: *user
  working_dir: /src
  volumes:
    - ..:/src
    - gocache:/cache

services:
  # One-shot Go toolchain (tests, vet, cross-compilation).
  go:
    <<: *go

  # One-shot Node toolchain (Astro build).
  node:
    image: node:24-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    user: *user
    working_dir: /src/web/admin
    environment:
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
    volumes:
      - ..:/src

  # Long-running Milo with mocked hardware. Open http://localhost:8080
  dev:
    <<: *go
    # MILO_DEV_SEED=0 skips the demo data, so the browser shows the first-run onboarding.
    command: sh -c 'go build -o /tmp/milo ./cmd/milo && /tmp/milo keygen && { [ "$${MILO_DEV_SEED}" = 0 ] || /tmp/milo dev-seed; } && exec /tmp/milo run'
    restart: unless-stopped # the admin "Restart Milo" button exits cleanly, like systemd Restart=always
    depends_on:
      - sim
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MILO_TELEGRAM_API_URL: http://sim:8081
      MILO_SIM_URL: http://sim:8081
      MILO_DEV_SEED: ${MILO_DEV_SEED:-1}
      MILO_DATA_DIR: /data
      MILO_LISTEN: ":8080"
      MILO_HARDWARE: mock
      MILO_LOG_LEVEL: debug
      MILO_MASTER_KEY_FILE: /data/master.key
    volumes:
      - ..:/src
      - gocache:/cache
      - devdata:/data

  # Simulator: fake family phones + fake Telegram Bot API. Open http://localhost:8090
  sim:
    <<: *go
    command: go run ./cmd/milo-sim
    ports:
      - "127.0.0.1:8090:8081"

  # Astro dev server with hot reload, proxying the API to the `dev` service.
  web-dev:
    image: node:24-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    user: *user
    working_dir: /src/web/admin
    command: corepack pnpm run dev --host 0.0.0.0
    environment:
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      MILO_API_URL: http://dev:8080
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - ..:/src

volumes:
  gocache:
  devdata:
